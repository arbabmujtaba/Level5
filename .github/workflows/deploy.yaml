name: deploy on ec2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: deploy over ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # First deploy: clone the repo if it isn't on the server yet
            if [ ! -d ~/level5/.git ]; then
              git clone https://github.com/${{ github.repository }}.git ~/level5
            fi
            cd ~/level5
            git pull origin main
            sudo docker compose down
            sudo docker compose up -d --build
